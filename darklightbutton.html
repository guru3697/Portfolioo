<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Button 29 – Dark / Light Toggle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg-light: #f5f7ff;
      --bg-dark: #050816;
      --text-light: #111827;
      --text-dark: #e5e7eb;

      --track-light: linear-gradient(135deg, #ffffff, #e5f0ff);
      --track-dark: linear-gradient(135deg, #15192c, #0b1120);

      --circle-light: radial-gradient(circle at 30% 30%, #ffffff, #facc15);
      --circle-dark: radial-gradient(circle at 30% 30%, #f9fafb, #64748b);

      --glow-light: rgba(250, 204, 21, 0.65);
      --glow-dark: rgba(56, 189, 248, 0.65);

      --transition-fast: 0.25s ease-out;
      --transition-med: 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color var(--transition-med),
        color var(--transition-med);
    }

    body.theme-light {
      background: radial-gradient(circle at top, #e0f2fe, #eef2ff 40%, #f9fafb 80%);
      color: var(--text-light);
    }

    body.theme-dark {
      background: radial-gradient(circle at top, #0f172a, #020617 50%, #000000 90%);
      color: var(--text-dark);
    }

    .page-wrapper {
      text-align: center;
      padding: 40px 24px;
    }

    .page-title {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.02em;
    }

    .page-text {
      margin: 0 0 32px;
      opacity: 0.8;
    }

    .theme-toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      color: inherit;
      font: inherit;
    }

    .toggle-track {
      position: relative;
      width: 140px;
      height: 64px;
      border-radius: 999px;
      padding: 6px;
      display: flex;
      align-items: center;
      box-shadow:
        0 0 0 1px rgba(15, 23, 42, 0.25),
        0 20px 45px rgba(15, 23, 42, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      overflow: hidden;
      transition: background var(--transition-med), box-shadow var(--transition-med),
        border-color var(--transition-med), transform var(--transition-fast);
    }

    body.theme-light .toggle-track {
      background: var(--track-light);
    }

    body.theme-dark .toggle-track {
      background: var(--track-dark);
    }

    .toggle-glow {
      position: absolute;
      inset: -40%;
      border-radius: inherit;
      background:
        radial-gradient(circle at 20% 20%, var(--glow-light), transparent),
        radial-gradient(circle at 70% 80%, var(--glow-dark), transparent);
      mix-blend-mode: screen;
      opacity: 0.7;
      pointer-events: none;
      transition: opacity var(--transition-med), transform var(--transition-med);
    }

    body.theme-light .toggle-glow {
      opacity: 0.75;
      transform: translateX(0);
    }

    body.theme-dark .toggle-glow {
      opacity: 0.95;
      transform: translateX(4px);
    }

    .toggle-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #e0f2fe;
      box-shadow: 0 0 8px rgba(125, 211, 252, 0.9);
      opacity: 0;
      transform: scale(0.4);
      transition: opacity var(--transition-med), transform var(--transition-med);
    }

    .star-1 { top: 16%; left: 18%; }
    .star-2 { top: 35%; right: 14%; }
    .star-3 { bottom: 18%; left: 55%; }

    body.theme-dark .star {
      opacity: 1;
      transform: scale(1);
    }

    .toggle-circle {
      position: relative;
      width: 50px;
      height: 50px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      transform: translateX(0);
      transition: transform var(--transition-med);
    }

    body.theme-dark .toggle-circle {
      transform: translateX(70px);
    }

    .circle-inner {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--circle-light);
      box-shadow:
        0 10px 25px rgba(15, 23, 42, 0.35),
        inset 0 0 0 1px rgba(250, 250, 250, 0.8);
      transition: background var(--transition-med), box-shadow var(--transition-med),
        transform var(--transition-med);
    }

    body.theme-dark .circle-inner {
      background: var(--circle-dark);
      box-shadow:
        0 8px 20px rgba(15, 23, 42, 0.75),
        inset 0 0 0 1px rgba(148, 163, 184, 0.8);
      transform: scale(0.95);
    }

    .circle-crater {
      position: absolute;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #e5e7eb, #9ca3af);
      opacity: 0;
      transform: scale(0.5);
      transition: opacity var(--transition-med), transform var(--transition-med);
    }

    .crater-1 {
      width: 12px;
      height: 12px;
      top: 16px;
      left: 14px;
    }

    .crater-2 {
      width: 8px;
      height: 8px;
      bottom: 14px;
      right: 14px;
    }

    body.theme-dark .circle-crater {
      opacity: 1;
      transform: scale(1);
    }

    .toggle-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 12px;
      text-align: left;
    }

    .label-sun,
    .label-moon {
      display: block;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.6;
      transition: opacity var(--transition-med), transform var(--transition-med);
    }

    body.theme-light .label-sun {
      opacity: 1;
      transform: translateY(0);
    }

    body.theme-light .label-moon {
      opacity: 0.25;
      transform: translateY(3px);
    }

    body.theme-dark .label-sun {
      opacity: 0.25;
      transform: translateY(-3px);
    }

    body.theme-dark .label-moon {
      opacity: 1;
      transform: translateY(0);
    }

    .theme-toggle:focus-visible .toggle-track {
      outline: 2px solid rgba(96, 165, 250, 0.8);
      outline-offset: 3px;
    }

    .theme-toggle:hover .toggle-track {
      transform: translateY(-1px);
      box-shadow:
        0 0 0 1px rgba(59, 130, 246, 0.5),
        0 22px 40px rgba(15, 23, 42, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .theme-toggle:active .toggle-track {
      transform: translateY(0);
      box-shadow:
        0 0 0 1px rgba(15, 23, 42, 0.35),
        0 10px 24px rgba(15, 23, 42, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body class="theme-light">
  <div class="page-wrapper">
    <h1 class="page-title">Light / Dark mode toggle (Button 29)</h1>
    <p class="page-text">
      Magical transitions between light and dark modes with a luminous toggle.
    </p>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <span class="toggle-track">
        <span class="toggle-glow"></span>
        <span class="toggle-stars">
          <span class="star star-1"></span>
          <span class="star star-2"></span>
          <span class="star star-3"></span>
        </span>
        <span class="toggle-circle">
          <span class="circle-inner"></span>
          <span class="circle-crater crater-1"></span>
          <span class="circle-crater crater-2"></span>
        </span>
      </span>
      <span class="toggle-label">
        <span class="label-sun">Light</span>
        <span class="label-moon">Dark</span>
      </span>
    </button>
  </div>

  <script>
    const toggle = document.getElementById("themeToggle");
    const body = document.body;

    function setTheme(mode) {
      if (mode === "dark") {
        body.classList.add("theme-dark");
        body.classList.remove("theme-light");
        toggle.setAttribute("aria-pressed", "true");
      } else {
        body.classList.add("theme-light");
        body.classList.remove("theme-dark");
        toggle.setAttribute("aria-pressed", "false");
      }
      localStorage.setItem("theme-mode", mode);
    }

    function initTheme() {
      const stored = localStorage.getItem("theme-mode");
      if (stored === "dark" || stored === "light") {
        setTheme(stored);
        return;
      }
      const prefersDark = window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;
      setTheme(prefersDark ? "dark" : "light");
    }

    toggle.addEventListener("click", () => {
      const isDark = body.classList.contains("theme-dark");
      setTheme(isDark ? "light" : "dark");
    });

    toggle.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggle.click();
      }
    });

    initTheme();
  </script>
</body>
</html>
