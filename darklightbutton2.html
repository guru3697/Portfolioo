<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.3/dist/dotlottie-wc.js" type="module"></script>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#dcdcdc;
}

/* TOGGLE */
.toggle{
  width:420px;
  height:180px;
  border-radius:100px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  border:10px solid #e6e6e6;
  box-shadow:
    inset 0 10px 20px rgba(0,0,0,0.2),
    0 5px 10px rgba(0,0,0,0.2);
}

input{display:none}

/* SKY */
.sky{
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#7a8fd8,#2d5bff);
  transition:0.8s ease;
}

/* ARC BANDS */
.sky::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:
    radial-gradient(circle at left center, rgba(255,255,255,0.22) 0%, transparent 45%),
    radial-gradient(circle at left center, rgba(255,255,255,0.14) 0%, transparent 65%),
    radial-gradient(circle at left center, rgba(255,255,255,0.08) 0%, transparent 80%);
}

/* DARK */
input:checked + .toggle .sky{
  background:linear-gradient(135deg,#020617,#0f172a);
}

/* TRACK */
.track{
  position:absolute;
  top:30px;
  left:30px;
  width:120px;
  height:120px;
  transition:0.8s cubic-bezier(.68,-0.55,.27,1.55);
}

input:checked + .toggle .track{
  transform:translateX(240px);
}

/* SUN */
.sun{
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  background:#ffd500;
  z-index:2;
  opacity:1;
  transition: opacity 0.45s ease 0.25s;
}

/* SUN GLOW */
.sun-glow{
  position:absolute;
  width:200px;
  height:200px;
  top:-40px;
  left:-40px;
  z-index:1;
  opacity:1;
  transition: opacity 0.45s ease 0.25s;
}

input:checked + .toggle .sun-glow{
  opacity:0;
}

/* MOON */
.moon{
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  background:#cfcfcf;
  box-shadow: inset -10px -10px 15px rgba(0,0,0,0.35);
  opacity:0;
  z-index:2;
  transition: opacity 0.45s ease 0.25s;
}

/* CRATERS */
.moon::before,
.moon::after{
  content:"";
  position:absolute;
  background:#6b7280;
  border-radius:50%;
}
.moon::before{ width:20px;height:20px;top:30px;left:25px;}
.moon::after{ width:30px;height:30px;top:60px;left:60px;}

/* CROSSFADE */
input:checked + .toggle .sun{ opacity:0; }
input:checked + .toggle .moon{ opacity:1; }

/* ===== LIGHT CLOUDS (SVG MULTI LAYER) ===== */
.clouds-day{
  position:absolute;
  bottom:0;
  width:200%;
  height:100%;
  animation:cloudMove 25s linear infinite;
}

.clouds-day svg{
  position:absolute;
  bottom:0;
  width:100%;
}

.layer2{ opacity:0.7; animation-duration:35s; }
.layer3{ opacity:0.5; animation-duration:45s; }

@keyframes cloudMove{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* HIDE DAY CLOUDS */
input:checked + .toggle .clouds-day{
  opacity:0;
}

/* ===== DARK CLOUDS (YOUR GIF) ===== */
.clouds-night{
  position:absolute;
  width:100%;
  height:100%;
  opacity:0;
  transition:0.6s;
  background: url("D:/Downloads/No result - clouds.gif") center/contain no-repeat;
  background-size: 120% 120%;
  background-position: center center;
  filter: brightness(1.1) opacity(0.85);
}

input:checked + .toggle .clouds-night{
  opacity:0.35;
}

/* ===== STARS ===== */
.stars{
  position:absolute;
  width:45%;
  height:100%;
  left:0;
  opacity:0;
}

input:checked + .toggle .stars{
  opacity:1;
}

.stars dotlottie-wc{
  transform:scale(1.6);
}

</style>
</head>

<body>

<input type="checkbox" id="t">

<label for="t" class="toggle">

  <div class="sky"></div>

  <!-- LIGHT CLOUDS (SVG EXACT STYLE) -->
  <div class="clouds-day">
    <svg viewBox="0 0 460 100">
      <path d="M0,100 C60,40 120,40 180,80 C240,30 300,30 360,70 C400,40 430,50 460,60 L460,100 Z" fill="#d9d9d9"/>
    </svg>
    <svg class="layer2" viewBox="0 0 460 100">
      <path d="M0,100 C50,50 100,30 150,70 C200,20 260,20 320,60 C360,30 420,40 460,70 L460,100 Z" fill="#e5e5e5"/>
    </svg>
    <svg class="layer3" viewBox="0 0 460 100">
      <path d="M0,100 C70,50 140,30 200,70 C260,20 320,30 380,60 C420,40 460,50 460,80 L460,100 Z" fill="#f0f0f0"/>
    </svg>
  </div>

  <!-- DARK CLOUDS (USE YOUR FILE) -->
  <div class="clouds-night"></div>

  <!-- TRACK -->
  <div class="track">

    <dotlottie-wc 
      class="sun-glow"
      src="https://lottie.host/0f4cf30f-ca6c-4426-a2ef-d164f641e759/a7ihP1859D.lottie"
      autoplay loop>
    </dotlottie-wc>

    <div class="sun"></div>
    <div class="moon"></div>

  </div>

  <!-- STARS -->
  <div class="stars">
    <dotlottie-wc 
      src="https://lottie.host/8da63608-3e6d-47ce-ad68-fe2864aff7ae/8GqmUZaG4W.lottie"
      style="width:100%;height:100%"
      autoplay loop>
    </dotlottie-wc>
  </div>

</label>

</body>
</html>
